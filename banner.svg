<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t">
  <title id="t">A CCTV-style frame with detection boxes: "Shree Sanjey" labelled person, "AI &amp; Video Analytics Intern @ Katomaran" labelled intern, "M.Sc. Software Systems, PSG Tech '28" labelled student, and a cup of filter coffee.</title>
  <defs>
    <clipPath id="frame"><rect width="1000" height="300" rx="14"/></clipPath>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity=".09"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .hud { font-size: 13px; fill: #7d8a97; letter-spacing: .06em; }
    .tag { font-size: 12px; font-weight: 700; fill: #0b0f14; }
    .rec { animation: blink 1.4s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .sweep { animation: sweep 6s linear infinite; }
    @keyframes sweep { from { transform: translateY(-60px); } to { transform: translateY(300px); } }
    .det { transform-box: fill-box; transform-origin: center; animation: lock .5s cubic-bezier(.2,.8,.2,1) both; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .8s; } .d3 { animation-delay: 1.1s; } .d4 { animation-delay: 1.8s; }
    @keyframes lock { from { opacity: 0; transform: scale(1.08); } to { opacity: 1; transform: scale(1); } }
    .steam { animation: steam 2.6s ease-in-out infinite; }
    .s2 { animation-delay: .9s; } .s3 { animation-delay: 1.7s; }
    @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: .8; } 100% { opacity: 0; transform: translateY(-10px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .sweep { display: none; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="#0b0f14"/>

    <!-- HUD -->
    <text class="hud" x="28" y="38">CAM 01 · PSG TECH, COIMBATORE</text>
    <circle class="rec" cx="914" cy="33" r="5" fill="#ef4444"/>
    <text class="hud" x="926" y="38">REC</text>
    <text class="hud" x="28" y="278">2026-10-27  09:41:07 IST</text>
    <text class="hud" x="972" y="278" text-anchor="end">1920×1080 · 30 FPS</text>

    <!-- #1 person -->
    <g class="det d1">
      <rect x="64" y="98" width="268" height="88" fill="none" stroke="#4ade80" stroke-width="2"/>
      <rect x="63" y="76" width="124" height="22" fill="#4ade80"/>
      <text class="tag" x="71" y="92">#1 person 0.99</text>
      <text x="86" y="162" font-size="62" font-weight="700" fill="#f1f5f9" textLength="224" lengthAdjust="spacing">Sanjey</text>
    </g>

    <!-- #2 intern -->
    <g class="det d2">
      <rect x="66" y="218" width="348" height="32" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <rect x="65" y="200" width="116" height="18" fill="#22d3ee"/>
      <text class="tag" x="72" y="213">#2 intern 0.96</text>
      <text x="80" y="239" font-size="14" fill="#cbd5e1" textLength="318" lengthAdjust="spacing">AI &amp; Video Analytics Intern @ Katomaran</text>
    </g>

    <!-- #3 student -->
    <g class="det d3">
      <rect x="444" y="218" width="330" height="32" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <rect x="443" y="200" width="124" height="18" fill="#fbbf24"/>
      <text class="tag" x="450" y="213">#3 student 0.94</text>
      <text x="458" y="239" font-size="14" fill="#cbd5e1" textLength="300" lengthAdjust="spacing">M.Sc. Software Systems · PSG Tech '28</text>
    </g>

    <!-- track trail into the coffee -->
    <path d="M590 178 Q700 150 806 142" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="2 7" opacity=".35"/>
    <circle cx="610" cy="173" r="2.2" fill="#f472b6" opacity=".15"/>
    <circle cx="660" cy="161" r="2.2" fill="#f472b6" opacity=".25"/>
    <circle cx="710" cy="152" r="2.2" fill="#f472b6" opacity=".35"/>
    <circle cx="760" cy="146" r="2.2" fill="#f472b6" opacity=".5"/>

    <!-- #4 filter coffee: tumbler in a davara -->
    <g class="det d4">
      <rect x="812" y="88" width="128" height="104" fill="none" stroke="#f472b6" stroke-width="2"/>
      <rect x="811" y="66" width="162" height="22" fill="#f472b6"/>
      <text class="tag" x="819" y="82">#4 filter coffee 0.91</text>
      <g fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round">
        <path class="steam" d="M866 116 q-4 -5 0 -10 q4 -5 0 -10"/>
        <path class="steam s2" d="M876 116 q-4 -5 0 -10 q4 -5 0 -10"/>
        <path class="steam s3" d="M886 116 q-4 -5 0 -10 q4 -5 0 -10"/>
      </g>
      <path d="M856 122 L896 122 L891 170 L861 170 Z" fill="#0b0f14" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round"/>
      <path d="M853 122 H899" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M840 160 H912 L902 178 Q876 184 850 178 Z" fill="#0b0f14" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <rect width="1000" height="300" fill="url(#scan)"/>
    <rect class="sweep" width="1000" height="60" fill="url(#sweep)"/>
    <rect width="1000" height="300" fill="url(#vig)"/>
  </g>
</svg>
